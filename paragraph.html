        <h2>Lv2 段落写作逻辑</h2>
        <div class="para">
            <h3>段落结构：主题句 → 扩展句 → 结尾句</h3>
            <p><span class="key">主题句</span>：点明段落中心思想，一般放在段首。</p>
            <p><span class="key">扩展句</span>：举例、解释、补充细节，支撑主题。</p>
            <p><span class="key">结尾句</span>：总结、重申观点。</p>
        </div>
        <div class="para">
            <h3>常用过渡衔接词</h3>
            <p>递进：besides, what’s more, in addition</p>
            <p>转折：however, but, on the contrary</p>
            <p>总结：in short, in a word, all in all</p>
        </div>
