        <div class="template">
            <h3>议论文通用框架</h3>
            <p>开头：引出话题，表明观点</p>
            <p>主体段1：阐述理由一 + 细节/举例</p>
            <p>主体段2：阐述理由二 + 细节/举例</p>
            <p>结尾：总结全文，重申观点</p>
        </div>

            <h3>书信类作文模板</h3>
