    <div class="content">
        <h2>Lv1 句子基础写作</h2>
        <div class="item">
            <h3>1. 主谓一致</h3>
            <p class="wrong">错误：He <u>like</u> English.</p>
            <p class="right">正确：He <u>likes</u> English.</p>
        </div>
        <div class="item">
            <h3>2. 时态规范</h3>
            <p class="wrong">错误：I <u>play</u> basketball yesterday.</p>
            <p class="right">正确：I <u>played</u> basketball yesterday.</p>
        </div>
        <div class="item">
            <h3>3. 名词单复数</h3>
            <p class="wrong">错误：I have many <u>book</u>.</p>
            <p class="right">正确：I have many <u>books</u>.</p>
        </div>
